version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: adaptsec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adaptsec
      POSTGRES_PASSWORD: adaptsec_secure_password_2026
      POSTGRES_DB: adaptsec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptsec-web
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://adaptsec:adaptsec_secure_password_2026@postgres:5432/adaptsec_db"
      NEXTAUTH_SECRET: "adaptsec-production-super-secret-key-change-in-prod-2026"
      NEXTAUTH_URL: "http://localhost:3000"
      LLM_ENABLED: "false"
      EMAIL_PROVIDER: "console"
    ports:
      - "3000:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
